services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    volumes:
      - kafka_data:/kafka
    networks:
      - monitoring
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "netstat -tln | grep 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "echo stat | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-init:
    image: wurstmeister/kafka:latest
    container_name: kafka-init
    networks:
      - monitoring
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command: >
      sh -c "
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic posts --partitions 1 --replication-factor 1 &&
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic posts.dlq --partitions 1 --replication-factor 1 &&
        kafka-topics.sh --bootstrap-server kafka:9092 --list
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - monitoring
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  post-service:
    build: ./post-service
    container_name: post-service
    environment:
      APP_ENV: dev
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_POSTS_TOPIC: posts
      OUTBOX_POLL_INTERVAL: 1s
      OUTBOX_RETRY_DELAY: 5s
      OUTBOX_MAX_ATTEMPTS: 5
      OUTBOX_BATCH_SIZE: 10
    ports:
      - "8000:8000"
    networks:
      - monitoring
    command: ["sh", "-c", "./migrator --migrations-path ./migrations && ./post-service"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  notification-service:
    build: ./notification-service
    container_name: notification-service
    environment:
      APP_ENV: dev
      KAFKA_BROKERS: kafka:9092
      KAFKA_POSTS_TOPIC: posts
      KAFKA_DLQ_TOPIC: posts.dlq
      KAFKA_CONSUMER_GROUP: notification-service
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      PROCESSED_EVENTS_TTL: 168h
      MAX_RETRY_ATTEMPTS: 3
      RETRY_BACKOFF: 1s
    networks:
      - monitoring
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring

  bombardier:
    profiles:
      - loadtest
    image: alpine/bombardier
    command: [
      "-c", "100",
      "-d", "30s",
      "-m", "POST",
      "-H", "Content-Type: application/json",
      "-b", '{"title":"Test","author":"Bombardier","content":"Test content","tags":["test"]}',
      "http://post-service:8000/posts"
    ]
    networks:
      - monitoring
    depends_on:
      - post-service

volumes:
  postgres_data:
  kafka_data:

networks:
  monitoring:
    driver: bridge
