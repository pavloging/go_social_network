env: "local" # local, dev, prod

http_server:
  address: "localhost:8000"
  timeout: 4s
  idle_timeout: 60s

kafka:
  brokers: ["localhost:9092"]
  topic: "posts"
  group_id: "notification-service"

redis:
  address: "localhost:6379"
  db: 0

outbox:
  poll_interval: 1s
  retry_delay: 5s
  max_attempts: 5
  batch_size: 10